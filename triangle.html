<!DOCTYPE html>
<html>
<head>
<style>


</style>
</head>

<body style="margin: 0 !important;
    padding: 0 !important;overflow: hidden; ">

<canvas id="myCanvas" width="window.innerWidth;" height="window.innerHeight;" style="background-color:rgb(76,76,76); "></canvas>

<script>


myCanvas.width = window.innerWidth;
myCanvas.height = window.innerHeight;


var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");
const cx = c.width / 2;
const cy = c.height / 2;
const side_length = Math.min(c.width,c.height)/1.5;

function draw() {
    ctx.clearRect(0, 0, c.width, c.height);

    // Background
    ctx.fillStyle = "rgb(76, 76, 76)";
    ctx.fillRect(0, 0, c.width, c.height);

    // Centered equilateral triangle
    
    ctx.beginPath();
    ctx.moveTo(cx, cy - side_length * Math.sqrt(3) / 3); // top
    ctx.lineTo(cx - side_length / 2, cy + side_length * Math.sqrt(3) / 6); // bottom left
    ctx.lineTo(cx + side_length / 2, cy + side_length * Math.sqrt(3) / 6); // bottom right
    ctx.closePath();
    ctx.fillStyle = "#FFCC00";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#333333";
    ctx.stroke();


   
    // UI
    
}






setInterval(draw, 10);



</script>
</body>
</html>
