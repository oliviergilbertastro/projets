
<!DOCTYPE html>
<html>
<head>
<style>
</style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;">

<canvas id="myCanvas" style="background-color:rgb(76,76,76);"></canvas>

<script>

const c = document.getElementById("myCanvas");
const ctx = c.getContext("2d");

c.width = window.innerWidth;
c.height = window.innerHeight;

// Polygon parameters
const cx = c.width / 2;
const cy = c.height / 2;

const n = 3; // Number of vertices
const radius = Math.min(c.width, c.height) / 3;

// Calculate polygon vertices
const corners = [];

for (let i = 0; i < n; i++) {
    const angle = -Math.PI / 2 + (2 * Math.PI * i / n);

    corners.push({
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
    });
}

// Starting point
let current_point = {
    x: cx,
    y: cy
};

// Calculate next point
function next_point() {

    // Randomly choose one of the polygon vertices
    const corner = corners[Math.floor(Math.random() * n)];

    // Calculate midpoint
    return {
        x: (current_point.x + corner.x) / 2,
        y: (current_point.y + corner.y) / 2
    };
}

// Draw a small circle
function draw_point(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1, 0, 2 * Math.PI);
    ctx.fillStyle = "black";
    ctx.fill();
}

// Draw polygon outline
function draw_polygon() {
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    for (let i = 1; i < n; i++) {
        ctx.lineTo(corners[i].x, corners[i].y);
    }
    ctx.closePath();
    ctx.fillStyle="white";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#333333";
    ctx.stroke();
}

// Animation
function draw() {

    for (let i = 0; i < 100; i++) {
        current_point = next_point();
        draw_point(current_point);
    }

}

// Initialize
draw_polygon();
setInterval(draw, 10);

</script>
</body>
</html>
