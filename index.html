<canvas id="myCanvas" width="window.innerWidth;" height="window.innerHeight;" style="background-color:rgb(76,76,76); "></canvas>

<script>

const now = new Date();
const dailyDate =
    `${String(now.getDate()).padStart(2, "0")}/` +
    `${String(now.getMonth() + 1).padStart(2, "0")}/`+now.getFullYear();

myCanvas.width = window.innerWidth;
myCanvas.height = window.innerHeight;


var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

var flagBox = { x: 0, y: 0, width: 0, height: 0 };
var insideButton = false;
let insideEraseButton = false;
let insideUndoButton = false;
let insideDailyButton = false;
var isDrawing = false;
let strokes = [];
let currentStroke = null;
var lastPoint = null;
let brushSize = 35;

function getCanvasPoint(event) {
    const rect = c.getBoundingClientRect();

    return {
        x: (event.clientX - rect.left) * c.width / rect.width,
        y: (event.clientY - rect.top) * c.height / rect.height
    };
}

function pointInBox(point, box) {
    return point.x >= box.x &&
        point.x <= box.x + box.width &&
        point.y >= box.y &&
        point.y <= box.y + box.height;
}

c.addEventListener("pointerdown", function(event) {
    const point = getCanvasPoint(event);

    insideButton = pointInBox(point, submitButton);
    insideEraseButton = pointInBox(point, eraseButton);
    insideUndoButton = pointInBox(point, undoButton);
    insideDailyButton = pointInBox(point, dailyButton);

    if (insideButton) return;

    if (pointInBox(point, copyResultButton)) {
        copyResultText();
        return;
    }

    if (pointInBox(point, copyDrawingButton)) {
        copyDrawingPNG();
        return;
    }

    if (pointInBox(point, dailyButton)) {
        window.location.href = "free_play.html";
        return;
    }

    if (submitted) {
        return;
    }

    if (insideEraseButton) {
        strokes = [];
        currentStroke = null;
        isDrawing = false;
        lastPoint = null;
        return;
    }

    if (insideUndoButton) {
        strokes.pop();
        currentStroke = null;
        isDrawing = false;
        lastPoint = null;
        return;
    }

    

    
    
    isDrawing = true;
    lastPoint = point;
    currentStroke = {
        color: drawColor,
        width: brushSize,
        points: [{ x: point.x, y: point.y }]
    };
    strokes.push(currentStroke);

    c.setPointerCapture(event.pointerId);
});

c.addEventListener("pointermove", function(event) {
    event.preventDefault();

    const point = getCanvasPoint(event);
    insideButton = pointInBox(point, submitButton);
    insideEraseButton = pointInBox(point, eraseButton);
    insideCopyResultButton = pointInBox(point, copyResultButton);
    insideCopyDrawingButton = pointInBox(point, copyDrawingButton);
    insideUndoButton = pointInBox(point, undoButton);
    insideDailyButton = pointInBox(point, dailyButton);

    if (!isDrawing || !currentStroke) return;

    currentStroke.points.push(point);
    lastPoint = point;
});


function stopPointer(event) {
    //console.log("insideButton:",insideButton)
    //console.log("Submitted:",submitted)
    if (insideButton) {
        submit();
    }

    insideButton = false;
    isDrawing = false;
    lastPoint = null;
    currentStroke = null;
    saveGameState();
}

c.addEventListener("pointerup", stopPointer);
c.addEventListener("pointercancel", stopPointer);

let submitted = false;
let scoreResult = null;
function submit() {
    if (!submitted) {
        drawingRGB = saveDrawingAsRGB();
        flagRGB = saveFlagAsRGB();
        const similarity = compareFlagArrays(drawingRGB, flagRGB);
        scoreResult = getDrawingScore(similarity);
        //console.log(`Score: ${scoreResult.score}/100 — ${scoreResult.category}`);
        submitted = true;
        saveGameState();
    }
    
}


FLAG_SIZE=c.width/5;
SPLIT = c.width/7;

class Flag {
    constructor(img_src, name, aspect_ratio) {
        this.image = new Image();
        this.image.crossOrigin = "anonymous";
        this.image.src = img_src;
        this.name = name
        this.aspect_ratio = aspect_ratio.width/aspect_ratio.height
        this.cx = FLAG_SIZE/2
        this.cy = (FLAG_SIZE*this.aspect_ratio)/2

        flagBox.width = FLAG_SIZE;
        flagBox.height = FLAG_SIZE * this.aspect_ratio;
        flagBox.x = (c.width - flagBox.width) / 2 - SPLIT;
        flagBox.y = (c.height - flagBox.height) / 2;
    }
    draw_self() {
        ctx.drawImage(this.image, myCanvas.width/2-this.cx+SPLIT, myCanvas.height/2-this.cy, FLAG_SIZE, FLAG_SIZE*this.aspect_ratio)
    }
}


async function getFlags() {
    const params = new URLSearchParams({
        action: "parse",
        page: "List of national flags of sovereign states",
        prop: "text",
        format: "json",
        origin: "*"
    });

    const response = await fetch(
        `https://en.wikipedia.org/w/api.php?${params}`
    );
    const data = await response.json();

    if (!response.ok || data.error) {
        throw new Error(data.error?.info || `Request failed: ${response.status}`);
    }

    const html = data.parse.text;
    const pageHTML = typeof html === "string" ? html : html["*"];
    const doc = new DOMParser().parseFromString(pageHTML, "text/html");

    const table = [...doc.querySelectorAll("table")]
        .find(table => table.innerText.includes("Aspect ratio"));

    if (!table) throw new Error("Couldn't find the flags table.");

    return [...table.querySelectorAll("tr")].flatMap(row => {
        const cells = [...row.querySelectorAll("td")];

        const ratioCell = cells.find(cell =>
            /^\s*\d+(?:\.\d+)?\s*:\s*\d+(?:\.\d+)?\s*$/.test(cell.innerText)
        );
        const ratioMatch = cells
        .map(cell => cell.innerText)
        .join(" ")
        .match(/(\d+(?:\.\d+)?)\s*:\s*(\d+(?:\.\d+)?)/);

    const countryLink = cells
        .flatMap(cell => [...cell.querySelectorAll("a[href^='/wiki/']")])
        .find(link => !link.querySelector("img"));

    const image = cells
        .flatMap(cell => [...cell.querySelectorAll("img")])
        .find(img => img.getAttribute("src"));

    if (!countryLink || !image) return [];

    let ratio;

    if (ratioMatch) {
        ratio = {
            width: Number(ratioMatch[1]),
            height: Number(ratioMatch[2])
        };
    } else {
        // Use the displayed thumbnail dimensions for rows without a listed ratio.
        const imageWidth = Number(image.getAttribute("width"));
        const imageHeight = Number(image.getAttribute("height"));

        if (!imageWidth || !imageHeight) return [];

        ratio = {
            width: imageHeight,
            height: imageWidth
        };
    }

    return [{
        name: countryLink.innerText.trim(),
        image: image.getAttribute("src"),
        ratio
    }];
    });
}



let drawingRGB = null;
let flagRGB = null;

function saveDrawingAsRGB() {
    const width = Math.round(flagBox.width);
    const height = Math.round(flagBox.height);

    const offscreen = document.createElement("canvas");
    offscreen.width = width;
    offscreen.height = height;

    const drawCtx = offscreen.getContext("2d");

    // Blank parts of the drawing become white in this RGB array.
    //drawCtx.fillStyle = "white";
    //drawCtx.fillRect(0, 0, width, height);

    // Draw the saved strokes in coordinates relative to the flag box.
    drawCtx.save();
    drawCtx.beginPath();
    drawCtx.rect(0, 0, width, height);
    drawCtx.clip();

    for (const stroke of strokes) {
        const points = stroke.points;
        if (points.length === 0) continue;

        drawCtx.strokeStyle = stroke.color;
        drawCtx.fillStyle = stroke.color;
        drawCtx.lineWidth = stroke.width;
        drawCtx.lineCap = "round";
        drawCtx.lineJoin = "round";

        if (points.length === 1) {
            drawCtx.beginPath();
            drawCtx.arc(
                points[0].x - flagBox.x,
                points[0].y - flagBox.y,
                stroke.width / 2,
                0,
                Math.PI * 2
            );
            drawCtx.fill();
        } else {
            drawCtx.beginPath();
            drawCtx.moveTo(
                points[0].x - flagBox.x,
                points[0].y - flagBox.y
            );

            for (let i = 1; i < points.length; i++) {
                drawCtx.lineTo(
                    points[i].x - flagBox.x,
                    points[i].y - flagBox.y
                );
            }

            drawCtx.stroke();
        }
    }

    drawCtx.restore();

    const pixels = drawCtx.getImageData(0, 0, width, height).data;

    // Shape: [height][width][RGB channel]
    return Array.from({ length: height }, (_, y) =>
    Array.from({ length: width }, (_, x) => {
        const i = (y * width + x) * 4;

        // null means no stroke was drawn at this pixel
        if (pixels[i + 3] === 0) return null;

        return [pixels[i], pixels[i + 1], pixels[i + 2]];
    })
);
}


function saveFlagAsRGB() {
    const width = Math.round(flagBox.width);
    const height = Math.round(flagBox.height);

    const offscreen = document.createElement("canvas");
    offscreen.width = width;
    offscreen.height = height;

    const drawCtx = offscreen.getContext("2d");
    drawCtx.drawImage(random_flag.image, 0, 0, width, height);

    const pixels = drawCtx.getImageData(0, 0, width, height).data;

    return Array.from({ length: height }, (_, y) =>
        Array.from({ length: width }, (_, x) => {
            const i = (y * width + x) * 4;
            if (pixels[i + 3] === 0) return null;
            return [pixels[i], pixels[i + 1], pixels[i + 2]];
        })
    );
}





function compareFlagArrays(drawing, flag) {
    const height = Math.min(drawing.length, flag.length);
    const width = Math.min(drawing[0].length, flag[0].length);

    if (width === 0 || height === 0) return 0;

    // Compare color distributions, ignoring pixels that are transparent in both.
    // Bin RGB into 4 levels per channel, plus one bin for transparent pixels.
    const binCount = 4 * 4 * 4 + 1;
    const drawingHistogram = new Array(binCount).fill(0);
    const flagHistogram = new Array(binCount).fill(0);
    const emptyBin = binCount - 1;

    function colorBin(pixel) {
        if (pixel === null) return emptyBin;

        const r = Math.min(3, Math.floor(pixel[0] / 64));
        const g = Math.min(3, Math.floor(pixel[1] / 64));
        const b = Math.min(3, Math.floor(pixel[2] / 64));

        return r * 16 + g * 4 + b;
    }

    let paintedPixels = 0;
    let relevantPixels = 0;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const drawn = drawing[y][x];
            const actual = flag[y][x];

            // Both transparent: ignore this pixel entirely.
            if (drawn === null && actual === null) continue;

            relevantPixels++;
            if (drawn !== null) paintedPixels++;

            drawingHistogram[colorBin(drawn)]++;
            flagHistogram[colorBin(actual)]++;
        }
    }

    // An empty drawing always gets zero similarity.
    if (paintedPixels === 0 || relevantPixels === 0) return 0;

    let histogramDifference = 0;

    for (let i = 0; i < binCount; i++) {
        const drawingAmount = drawingHistogram[i] / relevantPixels;
        const flagAmount = flagHistogram[i] / relevantPixels;
        histogramDifference += Math.abs(drawingAmount - flagAmount);
    }

    const distributionSimilarity = 1 - histogramDifference / 2;

    function similarityAtGridSize(gridSize) {
        let totalBlockError = 0;
        let comparedBlocks = 0;

        for (let gy = 0; gy < gridSize; gy++) {
            for (let gx = 0; gx < gridSize; gx++) {
                const xStart = Math.floor(gx * width / gridSize);
                const xEnd = Math.floor((gx + 1) * width / gridSize);
                const yStart = Math.floor(gy * height / gridSize);
                const yEnd = Math.floor((gy + 1) * height / gridSize);

                const drawingSum = [0, 0, 0];
                const flagSum = [0, 0, 0];
                let matchingPaintedPixels = 0;
                let oneSidedTransparentPixels = 0;
                let blockRelevantPixels = 0;

                for (let y = yStart; y < yEnd; y++) {
                    for (let x = xStart; x < xEnd; x++) {
                        const drawn = drawing[y][x];
                        const actual = flag[y][x];

                        // Both transparent: ignore this pixel.
                        if (drawn === null && actual === null) continue;

                        blockRelevantPixels++;

                        // Transparent on only one side: penalize it.
                        if (drawn === null || actual === null) {
                            oneSidedTransparentPixels++;
                            continue;
                        }

                        for (let channel = 0; channel < 3; channel++) {
                            drawingSum[channel] += drawn[channel];
                            flagSum[channel] += actual[channel];
                        }

                        matchingPaintedPixels++;
                    }
                }

                if (blockRelevantPixels === 0) continue;

                let blockError =
                    (oneSidedTransparentPixels / blockRelevantPixels) * 65025;

                if (matchingPaintedPixels > 0) {
                    let colorError = 0;

                    for (let channel = 0; channel < 3; channel++) {
                        const difference =
                            drawingSum[channel] / matchingPaintedPixels -
                            flagSum[channel] / matchingPaintedPixels;

                        colorError += difference * difference;
                    }

                    colorError /= 3;

                    blockError +=
                        (matchingPaintedPixels / blockRelevantPixels) * colorError;
                }

                totalBlockError += blockError;
                comparedBlocks++;
            }
        }

        if (comparedBlocks === 0) return 1;

        const averageError = totalBlockError / comparedBlocks;
        return 1 - averageError / 65025;
    }

    const lowResGrids = [1, 2, 4];
    const spatialLowRes =
        lowResGrids.reduce(
            (sum, gridSize) => sum + similarityAtGridSize(gridSize),
            0
        ) / lowResGrids.length;

    const highResGrids = [16, 32,64];
    const pooledHighRes =
        highResGrids.reduce(
            (sum, gridSize) => sum + similarityAtGridSize(gridSize),
            0
        ) / highResGrids.length;

    // Exact pixel comparison, also ignoring pixels transparent on both sides.
    let pixelError = 0;
    let pixelChannels = 0;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const drawn = drawing[y][x];
            const actual = flag[y][x];

            if (drawn === null && actual === null) continue;

            if (drawn === null || actual === null) {
                pixelError += 3 * 65025;
                pixelChannels += 3;
                continue;
            }

            for (let channel = 0; channel < 3; channel++) {
                const difference = drawn[channel] - actual[channel];
                pixelError += difference * difference;
                pixelChannels++;
            }
        }
    }

    const exactPixelSimilarity = pixelChannels === 0
        ? 1
        : 1 - (pixelError / pixelChannels) / 65025;

    const spatialHighRes = (pooledHighRes + exactPixelSimilarity) / 2;

    return (
        0.35 * distributionSimilarity +
        0.25 * spatialLowRes +
        0.40 * spatialHighRes
    );
}





function getDrawingScore(similarity) {
    // Similarities below this earn zero; raise it to make scoring stricter.
    const zeroScoreSimilarity = 0.2;
    const accuracy = Math.max(
        0,
        (similarity - zeroScoreSimilarity) / (1 - zeroScoreSimilarity)
    );

    let score = Math.round(100 * accuracy ** 1.25);
    if (score >100) {
        score=100;
    }
    let category;
    if (score >= 95) category = "Perfect";
    else if (score >= 80) category = "Excellent";
    else if (score >= 70) category = "Great";
    else if (score >= 50) category = "Good";
    else if (score >= 40) category = "Okay";
    else category = "Bad";

    return { score, category };
}












const submitButton = {
    x: 0,
    y: 0,
    width: 160,
    height: 56
};

function drawSubmitButton() {
    submitButton.x = c.width / 2 - submitButton.width / 2;
    submitButton.y = c.height*0.8;

    const { x, y, width, height } = submitButton;
    const radius = 14;

    
    if (submitted) {
        return;


    }

    ctx.save();

    
    // Shadow
    ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;

    // Rounded button background
    ctx.fillStyle = insideButton
        ? "rgb(235, 125, 15)"
        : "rgb(255, 170, 20)";

    ctx.beginPath();
    ctx.roundRect(x, y, width, height, radius);
    ctx.fill();

    // Draw the text without the shadow
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.fillStyle = "black";
    ctx.font = "bold 24px system-ui, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (!submitted) {
        ctx.fillText("Submit", x + width / 2, y + height / 2);
    } else {
        ctx.fillText("Next", x + width / 2, y + height / 2);
    }
    
    

    ctx.restore();
}

async function copyDrawingPNG() {
    if (!submitted || !scoreResult) return;

    const scale = Math.min(2, 700 / flagBox.width);
    const flagWidth = Math.round(flagBox.width * scale);
    const flagHeight = Math.round(flagBox.height * scale);

    const padding = 36;
    const headerHeight = 100;
    const footerHeight = 80;

    const imageCanvas = document.createElement("canvas");
    imageCanvas.width = flagWidth + padding * 2;
    imageCanvas.height = headerHeight + flagHeight + footerHeight + padding * 2;

    const imageCtx = imageCanvas.getContext("2d");

    // Card background
    imageCtx.fillStyle = "#30343b";
    imageCtx.fillRect(0, 0, imageCanvas.width, imageCanvas.height);

    // Country name
    imageCtx.fillStyle = "white";
    imageCtx.font = "bold 34px system-ui, Arial, sans-serif";
    imageCtx.textAlign = "center";
    imageCtx.textBaseline = "middle";
    imageCtx.fillText(
        random_flag.name,
        imageCanvas.width / 2,
        padding + 22
    );

    // White flag area
    const flagX = padding;
    const flagY = padding + headerHeight;

    //imageCtx.fillStyle = "white";
    //imageCtx.fillRect(flagX, flagY, flagWidth, flagHeight);

    // Draw the player's strokes, cropped to the flag box
    imageCtx.save();
    imageCtx.beginPath();
    imageCtx.rect(flagX, flagY, flagWidth, flagHeight);
    imageCtx.clip();

    for (const stroke of strokes) {
        const points = stroke.points;
        if (points.length === 0) continue;

        imageCtx.strokeStyle = stroke.color;
        imageCtx.fillStyle = stroke.color;
        imageCtx.lineWidth = stroke.width * scale;
        imageCtx.lineCap = "round";
        imageCtx.lineJoin = "round";

        const firstX = flagX + (points[0].x - flagBox.x) * scale;
        const firstY = flagY + (points[0].y - flagBox.y) * scale;

        if (points.length === 1) {
            imageCtx.beginPath();
            imageCtx.arc(
                firstX,
                firstY,
                stroke.width * scale / 2,
                0,
                Math.PI * 2
            );
            imageCtx.fill();
        } else {
            imageCtx.beginPath();
            imageCtx.moveTo(firstX, firstY);

            for (let i = 1; i < points.length; i++) {
                imageCtx.lineTo(
                    flagX + (points[i].x - flagBox.x) * scale,
                    flagY + (points[i].y - flagBox.y) * scale
                );
            }

            imageCtx.stroke();
        }
    }

    imageCtx.restore();

    // Flag border
    //imageCtx.strokeStyle = "#17191d";
    //imageCtx.lineWidth = 3;
    //imageCtx.strokeRect(flagX, flagY, flagWidth, flagHeight);

    // Score
    
    let color;
    if (scoreResult.score >= 95) color = "#5cff74";
    else if (scoreResult.score >= 80) color = "#b6f542";
    else if (scoreResult.score >= 60) color = "#ffd43b";
    else if (scoreResult.score >= 40) color = "#ff9f43";
    else color = "#ff5c5c";
    imageCtx.fillStyle = color;
    imageCtx.font = "bold 28px system-ui, Arial, sans-serif";
    imageCtx.fillText(
        `${scoreResult.category} — ${scoreResult.score}/100`,
        imageCanvas.width / 2,
        flagY + flagHeight + footerHeight / 2
    );

    try {
        const blob = await new Promise(resolve =>
            imageCanvas.toBlob(resolve, "image/png")
        );

        if (!blob) throw new Error("Could not create the PNG.");

        await navigator.clipboard.write([
            new ClipboardItem({ "image/png": blob })
        ]);

        copyStatus = "Copied!";
    } catch (error) {
        console.error("Could not copy image:", error);
        copyStatus = "Copy failed";
    }

    setTimeout(() => {
        copyStatus = "";
    }, 1500);
}





function drawStrokes() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(flagBox.x, flagBox.y, flagBox.width, flagBox.height);
    ctx.clip();

    for (const stroke of strokes) {
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        const points = stroke.points;
        if (points.length === 1) {
            ctx.beginPath();
            ctx.arc(points[0].x, points[0].y, stroke.width / 2, 0, Math.PI * 2);
            ctx.fillStyle = stroke.color;
            ctx.fill();
            continue;
        }

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
    }

    ctx.restore();
}

        dailyButton.y + dailyButton.height / 2
    );
    ctx.restore();
}



let rgb = { r: 229, g: 57, b: 53 };
let activeSlider = null;

function updateDrawColor() {
    drawColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
}
updateDrawColor();
function drawRGBPicker() {
    const { x, y, width, sliderHeight, gap } = rgbPicker;
    const channels = ["r", "g", "b"];
    const colors = ["#f33", "#3c3", "#39f"];

    ctx.save();
    //ctx.font = "14px system-ui, Arial";
    ctx.font = "bold 15px system-ui, Arial, sans-serif";
    ctx.textBaseline = "middle";

    channels.forEach((channel, i) => {
        const sliderY = y + i * gap;

        ctx.fillStyle = "white";
        ctx.textAlign = "left";
        ctx.fillText(channel.toUpperCase(), x, sliderY + sliderHeight / 2);

        const trackX = x + 24;
        const trackWidth = width - 24;

        ctx.fillStyle = colors[i];
        ctx.fillRect(trackX, sliderY, trackWidth, sliderHeight);

        const knobX = trackX + (rgb[channel] / 255) * trackWidth;
        ctx.beginPath();
        ctx.arc(knobX, sliderY + sliderHeight / 2, 9, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.stroke();
    });

    ctx.fillStyle = drawColor;
    ctx.fillRect(x + 24*3.7, y + gap * 3.8, width/2 - 24, width/2 - 24);
    ctx.strokeStyle = "white";
    ctx.strokeRect(x + 24*3.7, y + gap * 3.8, width/2 - 24, width/2 - 24);

    const sizeY = y + 9 * gap;
    const trackX = x + 24;
    const trackWidth = width - 24;

    ctx.font = "bold 20px system-ui, Arial, sans-serif";
    ctx.fillStyle = "white";
    ctx.textAlign = "left";
    ctx.fillText("Size", x-20, sizeY + sliderHeight / 2);

    // Track
    ctx.fillStyle = "#aaa";
    ctx.fillRect(trackX, sizeY, trackWidth, sliderHeight);

    // Small dot at the left end
    //ctx.beginPath();
    //ctx.arc(trackX, sizeY + sliderHeight / 2, 2, 0, Math.PI * 2);
    //ctx.fillStyle = "white";
    //ctx.fill();

    // Large dot at the right end
    //ctx.beginPath();
    //ctx.arc(trackX + trackWidth, sizeY + sliderHeight / 2, 10, 0, Math.PI * 2);
    //ctx.fill();

    // Current size indicator
    const minSize = 2;
    const maxSize = 80;
    const sizePosition = (brushSize - minSize) / (maxSize - minSize);
    const knobX = trackX + sizePosition * trackWidth;

    ctx.beginPath();
    ctx.arc(knobX, sizeY + sliderHeight / 2, brushSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.strokeStyle = "#333";
    ctx.fill();
    ctx.stroke();

    // Erase button
    eraseButton.x = x + 24;
    eraseButton.y = y + 9 * gap + 38;

    ctx.fillStyle = insideEraseButton ? "#888" : "#aaa";
    ctx.beginPath();
    ctx.roundRect(
        eraseButton.x,
        eraseButton.y,
        eraseButton.width,
        eraseButton.height,
        8
    );
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.font = "bold 20px system-ui, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(
        "Erase",
        eraseButton.x + eraseButton.width / 2,
        eraseButton.y + eraseButton.height / 2
    );


    // Undo button
    undoButton.x = eraseButton.x + eraseButton.width + 10;
    undoButton.y = eraseButton.y;

    ctx.fillStyle = insideUndoButton ? "#888" : "#aaa";
    ctx.beginPath();
    ctx.roundRect(
        undoButton.x,
        undoButton.y,
        undoButton.width,
        undoButton.height,
        8
    );
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.font = "bold 20px system-ui, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(
        "Undo",
        undoButton.x + undoButton.width / 2,
        undoButton.y + undoButton.height / 2
    );

    ctx.restore();
}

function updateSliderFromEvent(event) {
    const rect = c.getBoundingClientRect();
    const px = (event.clientX - rect.left) * c.width / rect.width;

    const trackX = rgbPicker.x + 24;
    const trackWidth = rgbPicker.width - 24;
    const amount = Math.max(0, Math.min(1, (px - trackX) / trackWidth));

    if (activeSlider === "size") {
        brushSize = 2 + amount * (80-2);
    } else {
        rgb[activeSlider] = Math.round(amount * 255);
        updateDrawColor();
    }
}

c.addEventListener("pointerdown", function(event) {
    const rect = c.getBoundingClientRect();
    const px = (event.clientX - rect.left) * c.width / rect.width;
    const py = (event.clientY - rect.top) * c.height / rect.height;

    const rgbChannels = ["r", "g", "b"];

    for (let i = 0; i < rgbChannels.length; i++) {
        const sliderY = rgbPicker.y + i * rgbPicker.gap;

        if (
            py >= sliderY - 8 &&
            py <= sliderY + rgbPicker.sliderHeight + 8 &&
            px >= rgbPicker.x &&
            px <= rgbPicker.x + rgbPicker.width
        ) {
            activeSlider = rgbChannels[i];
            updateSliderFromEvent(event);
            c.setPointerCapture(event.pointerId);
            return;
        }
    }

    const sizeY = rgbPicker.y + 9 * rgbPicker.gap;

    if (
        py >= sizeY - 8 &&
        py <= sizeY + rgbPicker.sliderHeight + 8 &&
        px >= rgbPicker.x &&
        px <= rgbPicker.x + rgbPicker.width
    ) {
        activeSlider = "size";
        updateSliderFromEvent(event);
        c.setPointerCapture(event.pointerId);
    }
});

c.addEventListener("pointermove", function(event) {
    if (activeSlider !== null) updateSliderFromEvent(event);
});

function stopRGBSlider() {
    activeSlider = null;
}

c.addEventListener("pointerup", stopRGBSlider);
c.addEventListener("pointercancel", stopRGBSlider);




function drawScoreResult() {

    let color;
    if (scoreResult.score >= 95) color = "#5cff74";

    else if (scoreResult.score >= 60) color = "#ffd43b";
    else if (scoreResult.score >= 40) color = "#ff9f43";
    else color = "#ff5c5c";

    ctx.save();
    ctx.fillStyle = color;
    ctx.font = "bold 26px system-ui, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(
        `${scoreResult.category} — ${scoreResult.score}/100`,
        submitButton.x + submitButton.width / 2,
        submitButton.y - 50
    );
    ctx.restore();
}
